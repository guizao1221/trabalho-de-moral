<!doctype html>
<html>

<head>

    <title>🎮 Sliding Puzzle</title>
    <link href="https://fonts.googleapis.com/css?family=Roboto+Condensed:400,700" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Indie+Flower&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="css/style.css">

    <meta name="viewport" content="initial-scale=1.0, width=device-width">
</head>

<body>
    <header>
        <img src="images/logo.png" alt="Sliding Puzzle">
    </header>
    <figure class="sliding-puzzle-figure">

        <ul class="sliding-puzzle">
            <li class="tile">1</li>
            <li class="tile">2</li>
            <li class="tile">3</li>
            <li class="tile">4</li>
            <li class="tile">5</li>
            <li class="tile">6</li>
            <li class="tile">7</li>
            <li class="tile">8</li>
            <li class="tile">9</li>
            <li class="tile">10</li>
            <li class="tile">11</li>
            <li class="tile">12</li>
            <li class="tile">13</li>
            <li class="tile">14</li>
            <li class="tile">15</li>
        </ul>
    </figure>

    <div id="controls">
        <button class="btn btn-shuffle" id="shuffle">baralhar</button>
        <button class="btn btn-solve" id="solve">resolver</button>
        <br>
        </div>
    </div>


    </footer>

    <div id="overlay">
        <div id="text">
            <span>
                Ganhaste!!!
                <br>
                🏆
            </span>
        </div>
    </div>

    <script type="text/javascript" src="js/script.js"></script>
</body>

</html>
